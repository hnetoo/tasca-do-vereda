<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar Schema do Banco</title>
</head>
<body>
    <h1>Verificar Schema das Tabelas</h1>
    <button onclick="checkSchema()" style="padding: 10px 20px; font-size: 16px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer;">
        Verificar Schema
    </button>
    <div id="result" style="margin-top: 20px; padding: 10px; border: 1px solid #ccc; border-radius: 5px; white-space: pre-wrap; font-family: monospace;"></div>
    
    <script>
        async function checkSchema() {
            try {
                document.getElementById('result').innerHTML = '🔍 Verificando schema...';
                
                const response = await fetch('/api/debug/schema');
                const contentType = response.headers.get('content-type');
                
                document.getElementById('result').innerHTML = `
                    Content-Type: ${contentType}
                    Status: ${response.status}
                    
                    Resposta bruta:
                    ${await response.text()}
                `;
                
            } catch (error) {
                document.getElementById('result').innerHTML = `❌ Erro: ${error.message}`;
            }
        }
    </script>
</body>
</html>
